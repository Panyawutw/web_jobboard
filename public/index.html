<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>



<section id="auth-section">
    <h2>เข้าสู่ระบบ</h2>

    <form id="login-form">
        <label for="login-email">อีเมล</label>
        <input
            type="email"
            id="login-email"
            autocomplete="email"
            required
        >

        <label for="login-password">รหัสผ่าน</label>
        <input
            type="password"
            id="login-password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="login-btn">
            เข้าสู่ระบบ
        </button>
    </form>

    <p id="auth-message" role="status"></p>

    <div id="user-session" hidden>
        <p id="user-info"></p>
        <button type="button" id="logout-btn">
            ออกจากระบบ
        </button>
    </div>
</section>



    <header>
        <h1>FreelanceHub</h1>
        <p style="text-align: center;">แพลตฟอร์มค้นหาและจัดการงานฟรีแลนซ์</p>
    </header>

    <main>

        <!-- SEARCH AND FILTER -->
        <section id="search-section">
            <h2>ค้นหางาน</h2>

            <label for="search-input">ค้นหาชื่องานหรือหมวดหมู่</label>
            <input type="text" id="search-input" placeholder="เช่น Frontend Developer">

            <label for="categories">หมวดหมู่</label>
            <select id="categories">
                <option value="All">ทุกหมวดหมู่</option>
                <option value="Web Development">Web Development</option>
                <option value="Design">Design</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="Android">Android</option>
                <option value="c#">C#</option>
            </select>

            <label for="budgetfilter">งบประมาณ</label>
            <select id="budgetfilter">
                <option value="All">ทุกงบประมาณ</option>
                <option value="under10k">ต่ำกว่า 10,000 บาท</option>
                <option value="10to20k">10,000–20,000 บาท</option>
                <option value="over20k">มากกว่า 20,000 บาท</option>
            </select>
        </section>

        <!-- CREATE AND UPDATE FORM -->
        <section id="job-form-section">
            <h2 id="form-title">เพิ่มงานใหม่</h2>

            <form id="job-form">

                <label for="job-title">ชื่องาน</label>
                <input type="text" id="job-title" placeholder="กรอกชื่องาน" required>

                <label for="job-category">หมวดหมู่</label>
                <input type="text" id="job-category" placeholder="เช่น Web Development" required>

                <label for="job-budget">งบประมาณ (บาท)</label>
                <input type="number" id="job-budget" min="1" step="any" placeholder="กรอกงบประมาณ" required>

                <label for="job-location">สถานที่ทำงาน</label>
                <input type="text" id="job-location" placeholder="เช่น Remote หรือ Bangkok" required>

                <label for="job-description">รายละเอียดงาน</label>
                <textarea id="job-description" placeholder="อธิบายรายละเอียดของงาน" required></textarea>

                <div class="form-actions">
                    <button type="submit">เพิ่มงาน</button>
                    <button type="reset" id="reset-form">ล้างฟอร์ม</button>
                </div>

            </form>
        </section>

        <!-- JOB LIST -->
        <section>
            <h2>รายการงาน</h2>
            <div id="job-list"></div>
        </section>

        <!-- JOB DETAILS -->
        <section>
            <h2>รายละเอียดงาน</h2>
            <div id="job-detail">
                <p>เลือก View Details ของงานเพื่อดูรายละเอียด</p>
            </div>
        </section>

    </main>


    <script src="script.js"></script>
  </body>
</html>
