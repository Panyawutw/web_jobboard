<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Freelance Jobs</h1>
    <input type="text" id="search-input" placeholder="Search jobs..." />

    <select name="categories" id="categories">
      <option value="All">All</option>
      <option value="Web Development">Web Development</option>
      <option value="Design">Design</option>
      <option value="Java">Java</option>
      <option value="Python">Python</option>
    </select>
    <select name="categories" id="budgetfilter">
      <option value="All">All</option>
      <option value="under10k">ต่ำกว่า 10,000</option>
      <option value="10to20k">10,000 - 20,000</option>
      <option value="over20k">มากกว่า 20,000</option>
    </select>

   <form id="job-form">
    <h2>เพิ่มงานใหม่</h2>
    
    <div>
        <label for="job-title">ชื่อตำแหน่งงาน:</label>
        <input type="text" id="job-title" placeholder="ระบุตำแหน่งงาน หรือ ชื่อบริษัท">
    </div>

    <div>
        <label for="job-category">ประเภทงาน:</label>
        <input type="text" id="job-category" placeholder="ค้นหา ประเภทงาน">
    </div>

    <div>
        <label for="job-budget">เงินเดือน (บาท):</label>
        <input type="number" id="job-budget" placeholder="0">
    </div>

    <div>
        <label for="job-location">สถานที่ปฏิบัติงาน:</label>
        <input type="text" id="job-location" placeholder="ค้นหา สถานที่ปฏิบัติงาน">
    </div>

    <div>
        <label for="job-description">Description:</label>
        <textarea id="job-description" placeholder="กรอกรายละเอียดงาน..."></textarea>
    </div>

    <button type="submit">เพิ่มงาน</button>
</form>

    <div id="job-list"></div>
    <div id="job-detail"></div>
    <script src="script.js"></script>
  </body>
</html>
